# Alembic configuration file.
#
# WHY Alembic instead of just SQLModel.metadata.create_all()?
# - create_all() only ADDS tables — it can't ALTER existing columns,
#   add indexes, or drop old tables.
# - In production, schema changes MUST be versioned and reversible.
#   Alembic generates migration scripts that can be reviewed, tested,
#   and rolled back if something goes wrong.
# - Think of it as "git for your database schema".

[alembic]
script_location = alembic
prepend_sys_path = .

# Connection string placeholder — overridden at runtime by env.py
# using the same DATABASE_URL from our Pydantic Settings.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
